name: vault
description: Yucon 钥仓
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  http: ^1.6.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
  socks5_proxy: ^2.1.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  cryptography: ^2.7.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/yucon-app-icon.png
    - assets/brand/yucon-lockup-light.png
    - assets/brand/yucon-lockup-dark.png
    - assets/brand/yucon-logo.png
    - assets/model-brands/
